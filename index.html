<!DOCTYPE html>
<html>
  <head>
    <title>Bull Clicker</title>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-
scale=1, maximum-scale=1, user-scalable=no">
  </head>

  <body>
    <video id="camera" autoplay playsinline></video>
    <div class="game-wrapper">
      <h1>Bull Clicker</h1>

      <p id="counter">Bulls: 1</p>
      <p id="clickPower">Click Power: 1</p>
      <button id="bullBtn">
        <img src="images/bull.png" alt="Bull">
      </button>
    </div>

    <div id="shop">
      <h2>Shop</h2>

      <button id="multiplierBtn">Buy x2 Click Power - Cost: 50</button>

      <button id="autoClickerBtn">Buy Auto Clicker - Cost: 500</button>
    </div>

    <script src="script.js"></script>
  </body>
</html>
